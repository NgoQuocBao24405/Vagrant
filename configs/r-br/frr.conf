frr version 10.7.1
frr defaults traditional
hostname r-br
no ipv6 forwarding
!
interface eth1
 description L02 to r-hq eth2
 ip address 10.0.0.6/30
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
 description L03 to r-edge eth2
 ip address 10.0.0.9/30
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
 description L09 LAN Branch
 ip address 192.168.30.1/24
 ip ospf passive
!
interface lo
 ip address 10.255.0.2/32
!
router ospf
 ospf router-id 10.255.0.2
 network 10.255.0.2/32 area 1
 network 10.0.0.4/30 area 1
 network 10.0.0.8/30 area 1
 network 192.168.30.0/24 area 1
!
line vty
!
