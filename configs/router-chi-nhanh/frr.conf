!
frr version 10.7.1_git
frr defaults traditional
hostname router-chi-nhanh
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 description day-tru-so-chi-nhanh toi router-tru-so eth2
 ip address 10.0.0.6/30
 ip ospf cost 10
 ip ospf network point-to-point
exit
!
interface eth2
 description day-bien-chi-nhanh toi router-bien eth2
 ip address 10.0.0.9/30
 ip ospf cost 10
 ip ospf network point-to-point
exit
!
interface eth3
 description day-lan-chi-nhanh LAN chi nhanh (may-tinh-chi-nhanh)
 ip address 192.168.30.1/24
 ip ospf passive
exit
!
interface lo
 ip address 10.255.0.2/32
exit
!
router ospf
 ospf router-id 10.255.0.2
 network 10.0.0.4/30 area 1
 network 10.0.0.8/30 area 1
 network 10.255.0.2/32 area 1
 network 192.168.30.0/24 area 1
exit
!
