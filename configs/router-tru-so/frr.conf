!
frr version 10.7.1_git
frr defaults traditional
hostname router-tru-so
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 description day-tru-so-bien toi router-bien eth1
 ip address 10.0.0.1/30
 ip ospf cost 10
 ip ospf network point-to-point
exit
!
interface eth2
 description day-tru-so-chi-nhanh toi router-chi-nhanh eth1
 ip address 10.0.0.5/30
 ip ospf cost 10
 ip ospf network point-to-point
exit
!
interface eth3
 description day-lan-tru-so toi may-tinh-tru-so
 ip address 192.168.10.1/24
 ip ospf passive
exit
!
interface eth4
 description day-tru-so-switch LAN may chu tru so (switch-may-chu)
 ip address 192.168.20.1/24
 ip ospf passive
exit
!
interface lo
 ip address 10.255.0.1/32
exit
!
router ospf
 ospf router-id 10.255.0.1
 network 10.0.0.0/30 area 0
 network 10.0.0.4/30 area 1
 network 10.255.0.1/32 area 0
 network 192.168.10.0/24 area 0
 network 192.168.20.0/24 area 0
exit
!
