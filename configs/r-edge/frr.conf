frr version 10.7.1
frr defaults traditional
hostname r-edge
no ipv6 forwarding
!
interface eth1
 description L01 to r-hq eth1
 ip address 10.0.0.2/30
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
 description L03 to r-br eth2
 ip address 10.0.0.10/30
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
 description L04 to r-isp eth1 (eBGP)
 ip address 203.0.113.2/30
!
interface lo
 ip address 10.255.0.3/32
!
router ospf
 ospf router-id 10.255.0.3
 network 10.255.0.3/32 area 0
 network 10.0.0.0/30 area 0
 network 10.0.0.8/30 area 1
 default-information originate
!
ip prefix-list PL-ABC-OUT seq 10 permit 192.168.10.0/24
ip prefix-list PL-ABC-OUT seq 20 permit 192.168.20.0/24
ip prefix-list PL-ABC-OUT seq 30 permit 192.168.30.0/24
ip prefix-list PL-ISP-IN seq 10 permit 0.0.0.0/0
ip prefix-list PL-ISP-IN seq 20 permit 198.51.100.0/24
!
route-map RM-ISP-IN permit 10
 match ip address prefix-list PL-ISP-IN
!
route-map RM-ISP-OUT permit 10
 match ip address prefix-list PL-ABC-OUT
!
router bgp 65001
 bgp router-id 10.255.0.3
 neighbor 203.0.113.1 remote-as 65000
 neighbor 203.0.113.1 description r-isp AS65000
 !
 address-family ipv4 unicast
  network 192.168.10.0/24
  network 192.168.20.0/24
  network 192.168.30.0/24
  neighbor 203.0.113.1 route-map RM-ISP-IN in
  neighbor 203.0.113.1 route-map RM-ISP-OUT out
 exit-address-family
!
line vty
!
