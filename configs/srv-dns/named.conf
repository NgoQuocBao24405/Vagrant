// named.conf – BIND9 cho srv-dns. Alpine KHÔNG cung cấp sẵn file này.
options {
  directory "/var/bind";
  pid-file "/run/named/named.pid";
  session-keyfile "/run/named/session.key";
  listen-on { any; };
  listen-on-v6 { none; };
  allow-query { any; };
  recursion no;          // chỉ trả lời zone nội bộ, không làm resolver
};
controls { };            // tắt rndc, lab không cần

zone "abc.lab" IN {
  type primary;
  file "/etc/bind/db.abc.lab";
};
