frr version 10.7.1
frr defaults traditional
hostname r-isp
no ipv6 forwarding
!
interface eth1
 description L04 to r-edge eth3 (customer ABC)
 ip address 203.0.113.1/30
!
interface eth2
 description L10 Internet segment
 ip address 198.51.100.1/24
!
interface lo
 ip address 10.255.0.4/32
!
ip prefix-list PL-CUST-IN seq 10 permit 192.168.0.0/16 le 24
ip prefix-list PL-ISP-OUT seq 10 permit 0.0.0.0/0
ip prefix-list PL-ISP-OUT seq 20 permit 198.51.100.0/24
!
route-map RM-CUST-IN permit 10
 match ip address prefix-list PL-CUST-IN
!
route-map RM-CUST-OUT permit 10
 match ip address prefix-list PL-ISP-OUT
!
router bgp 65000
 bgp router-id 10.255.0.4
 neighbor 203.0.113.2 remote-as 65001
 neighbor 203.0.113.2 description r-edge AS65001 (ABC)
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 203.0.113.2 default-originate
  neighbor 203.0.113.2 route-map RM-CUST-IN in
  neighbor 203.0.113.2 route-map RM-CUST-OUT out
 exit-address-family
!
line vty
!
