frr version 10.7.1
frr defaults traditional
hostname r-hq
no ipv6 forwarding
!
interface eth1
 description L01 to r-edge eth1
 ip address 10.0.0.1/30
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
 description L02 to r-br eth1
 ip address 10.0.0.5/30
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
 description L05 LAN HQ users
 ip address 192.168.10.1/24
 ip ospf passive
!
interface eth4
 description L06 LAN HQ servers (br-srv)
 ip address 192.168.20.1/24
 ip ospf passive
!
interface lo
 ip address 10.255.0.1/32
!
router ospf
 ospf router-id 10.255.0.1
 network 10.255.0.1/32 area 0
 network 10.0.0.0/30 area 0
 network 192.168.10.0/24 area 0
 network 192.168.20.0/24 area 0
 network 10.0.0.4/30 area 1
!
line vty
!
